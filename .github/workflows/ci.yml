name: CI

on:
  push:
    # Branches only. A tag push starts release.yml, which calls this workflow itself.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    # A pull request from a branch of this repository is already tested by the push. Called from
    # release.yml, the event is the one of the caller: a tag push or a manual start.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          # The `python` feature builds PyO3, which looks for an interpreter and refuses one newer
          # than it supports. Pinned so that a new runner image cannot break the lint.
          python-version: "3.15"
      - name: Format
        run: cargo fmt --check
      - name: Lint, including the Python binding
        run: cargo clippy --locked --all-targets --features python -- -D warnings
      - name: Test
        run: cargo test --locked

  python:
    name: Python
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          # The newest version that PyO3 0.30 supports.
          python-version: "3.15"
      - name: Install build and test tools
        run: pip install maturin pytest numpy
      - name: Build the wheel
        run: maturin build --locked --out dist
      - name: Install the wheel
        run: pip install --no-index --find-links dist bos-geo
      - name: Test
        run: pytest tests/python
