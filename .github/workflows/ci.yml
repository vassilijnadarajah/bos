name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    # A pull request from a branch of this repository is already tested by the push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          # The `python` feature builds PyO3, which looks for an interpreter and refuses one newer
          # than it supports. Pinned so that a new runner image cannot break the lint.
          python-version: "3.15"
      - name: Format
        run: cargo fmt --check
      - name: Lint, including the Python binding
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Test
        run: cargo test

  python:
    name: Python
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          # The newest version that PyO3 0.30 supports.
          python-version: "3.15"
      - name: Install build and test tools
        run: pip install maturin pytest numpy
      - name: Build the wheel
        run: maturin build --out dist
      - name: Install the wheel
        run: pip install --no-index --find-links dist bos-geo
      - name: Test
        run: pytest tests/python
