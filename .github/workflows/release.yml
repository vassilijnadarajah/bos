# Builds the wheels and the source distribution of bos-geo, tests them and, on a version tag,
# publishes them to PyPI and creates a GitHub release.
#
#   check-version ─┐
#                  ├─> linux, musllinux, windows, macos, sdist ─┬─> test-artifacts ──┬─> attest ─> publish ─> github-release
#   tests (ci.yml) ┘                                            └─> check-artifacts ─┘             (tag only) (tag only)
#
# A manual start is a dry run: everything except `publish` and `github-release`.
#
# The build jobs and the upload step started as the output of `maturin generate-ci github`
# (maturin 1.16.0, configured in pyproject.toml). Changed by hand: the triggers, the gates before
# the build, `--locked`, no sccache, no free-threaded wheels (the binding uses the stable ABI, see
# `python` in Cargo.toml), the jobs after the build, and the action versions.
#
# PyPI trusts this file by its name and the environment `pypi`. Renaming either breaks publishing
# until the trusted publisher on PyPI is changed to match.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0
      - name: Compare the tag with Cargo.toml, CHANGELOG.md and main
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "bos-geo") | .version')
          echo "Version in Cargo.toml: $version"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Started on a branch: a dry run, there is no tag to check."
            exit 0
          fi
          failed=0
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but Cargo.toml has version $version (tag v$version)."
            failed=1
          fi
          if ! grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading '## $version'."
            failed=1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main."
            failed=1
          fi
          exit "$failed"

  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build manylinux ${{ matrix.platform.target }}
    needs: [check-version, tests]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          manylinux: auto
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    name: Build musllinux ${{ matrix.platform.target }}
    needs: [check-version, tests]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          manylinux: musllinux_1_2
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    name: Build Windows ${{ matrix.platform.target }}
    needs: [check-version, tests]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Python for Windows arm64 does not go back to 3.9. The wheel is the same.
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    name: Build macOS ${{ matrix.platform.target }}
    needs: [check-version, tests]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Build the source distribution
    needs: [check-version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload the source distribution
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  test-artifacts:
    # Installs what was built, not a fresh build, and runs the Python tests against it. With the
    # oldest and the newest supported Python, because one stable-ABI wheel has to serve both.
    # The wheels of the cross-compiled architectures are not tested.
    name: Test ${{ matrix.artifact }} on Python ${{ matrix.python }}
    needs: [linux, musllinux, windows, macos, sdist]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: wheels-linux-x86_64, runner: ubuntu-latest, python: "3.9" }
          - { artifact: wheels-linux-x86_64, runner: ubuntu-latest, python: "3.15" }
          - { artifact: wheels-windows-x64, runner: windows-latest, python: "3.9" }
          - { artifact: wheels-windows-x64, runner: windows-latest, python: "3.15" }
          # Python for Windows arm64 does not go back to 3.9.
          - { artifact: wheels-windows-aarch64, runner: windows-11-arm, python: "3.15" }
          - { artifact: wheels-macos-aarch64, runner: macos-latest, python: "3.9" }
          - { artifact: wheels-macos-aarch64, runner: macos-latest, python: "3.15" }
          - { artifact: wheels-macos-x86_64, runner: macos-15-intel, python: "3.9" }
          - { artifact: wheels-macos-x86_64, runner: macos-15-intel, python: "3.15" }
          # The source distribution is compiled here, with the Rust toolchain of the runner. It
          # shows that the source distribution is complete.
          - { artifact: wheels-sdist, runner: ubuntu-latest, python: "3.15" }
    steps:
      # For tests/python and the README, whose examples the tests run.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the test tools
        run: python -m pip install pytest numpy
      - name: Install the wheel
        if: matrix.artifact != 'wheels-sdist'
        run: python -m pip install --no-index --find-links dist bos-geo
      - name: Build and install the source distribution
        if: matrix.artifact == 'wheels-sdist'
        run: python -m pip install dist/bos_geo-*.tar.gz
      - name: Test
        run: python -m pytest tests/python

  check-artifacts:
    name: Check the set of files
    needs: [linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Count the files and look into them
        run: |
          set -euo pipefail
          ls -l dist
          failed=0
          wheels=$(find dist -name '*.whl' | wc -l)
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          # 6 manylinux, 4 musllinux, 3 Windows, 2 macOS.
          if [ "$wheels" -ne 15 ] || [ "$sdists" -ne 1 ] || [ "$(find dist -type f | wc -l)" -ne 16 ]; then
            echo "::error::Expected 15 wheels and 1 source distribution, found $wheels and $sdists."
            failed=1
          fi
          for wheel in dist/*.whl; do
            case "$wheel" in
              *-cp39-abi3-*) ;;
              *) echo "::error::$wheel is not a stable-ABI wheel for Python 3.9 and later."; failed=1 ;;
            esac
            contents=$(unzip -Z1 "$wheel")
            for file in bos_geo/__init__.pyi bos_geo/py.typed; do
              if ! grep -qx "$file" <<< "$contents"; then
                echo "::error::$wheel has no $file."
                failed=1
              fi
            done
          done
          # The directories that `exclude` in Cargo.toml keeps out.
          if tar -tzf dist/*.tar.gz | grep -E '^[^/]+/(\.github|\.vscode|AgentDocs|docs|literature|sample)/'; then
            echo "::error::The source distribution contains the files listed above."
            failed=1
          fi
          exit "$failed"
      - name: Check the metadata and the README as PyPI will render it
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

  attest:
    # Runs in a dry run too, so that the first tag is not the first time it is tried.
    name: Attest the files
    needs: [test-artifacts, check-artifacts]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Generate the artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

  publish:
    # Must stay in this file: PyPI's trusted publishing does not work from a called workflow.
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bos-geo/
    permissions:
      # For the short-lived token that PyPI exchanges for the right to upload. No secret is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      # setup-uv has no moving major tag; this is v10.3.3.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      # `--check-url` skips files that PyPI already has, so this job can be run again after an
      # upload that stopped half way.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  github-release:
    name: Create the GitHub release
    if: github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Cut the section of this version out of CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "bos-geo ${GITHUB_REF_NAME#v}"
          --notes-file notes.md dist/*
