[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "bos-geo"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
# `python` compiles the binding (src/python.rs). `pyo3/extension-module` keeps the module from
# linking libpython; PyO3 0.24 needs it spelled out. From PyO3 0.26 with maturin 1.9.4 the build
# tool sets this itself and the second entry can go.
features = ["python", "pyo3/extension-module"]
