[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "bos-geo"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
# `python` compiles the binding (src/python.rs). maturin 1.9.4 or later keeps the module from
# linking libpython by itself; PyO3's `extension-module` feature, which used to do that, is
# deprecated.
features = ["python"]
